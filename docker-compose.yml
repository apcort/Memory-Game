services:
  db:
    image: postgres:16-alpine
    container_name: memory_game_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-memory_game_db}
      POSTGRES_USER: ${DB_USER:-memory_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-memory_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-memory_user} -d ${DB_NAME:-memory_game_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - memory_network

  web:
    build: .
    container_name: memory_game_web
    restart: unless-stopped
    command: /app/entrypoint.sh
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-clave-secreta-de-desarrollo-cambiar-en-produccion}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-memory_game_db}
      DB_USER: ${DB_USER:-memory_user}
      DB_PASSWORD: ${DB_PASSWORD:-memory_pass}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - memory_network

networks:
  memory_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
